name: Verify VIDEO STUDIO AI production audio
on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - "video-studio-ai/functions/**"
      - "video-studio-ai/worker/**"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Manual deploy to Cloudflare Pages"]
    types: [completed]
jobs:
  production-audio-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Verify deployed audio engines and speech pipeline
        env:
          PRODUCTION_URL: https://video-studio-ai.pages.dev
          ASSET_VERSION: "20261127-audio4"
        run: |
          set -euo pipefail
          has() { grep -Fq -- "$1" <<< "$2"; }
          for attempt in $(seq 1 24); do
            if ! html=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/?v=$ASSET_VERSION"); then
              echo "Attempt $attempt/24: production HTML is not reachable"
            elif ! has "/scene-engine.js?v=$ASSET_VERSION" "$html"; then
              echo "Attempt $attempt/24: waiting for production HTML version $ASSET_VERSION"
            else
              scene=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/scene-engine.js?v=$ASSET_VERSION")
              scene_ok=true
              for token in 'audioVersion:"20261127-audio4"' 'function addMurmur' 'function addBirdChirps' 'function addEngineRev' 'ambiente_zoologico' 'ambiente_consultorio' 'ambiente_mercado' 'ambiente_plaza_comercial' 'ambiente_restaurante' 'ambiente_autodromo' 'ambiente_calle' 'ambiente_biblioteca' 'ambiente_escuela' 'ambiente_museo' 'ambiente_hotel' 'ambiente_iglesia' 'ambiente_parque' 'ambiente_piscina' 'ambiente_autobus' 'ambiente_construccion' 'ambiente_teatro' 'ambiente_gimnasio'; do
                if ! has "$token" "$scene"; then echo "Missing scene-engine token: $token"; scene_ok=false; fi
              done
              if [ "$scene_ok" = true ]; then
                renderer=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/film-renderer.js?v=$ASSET_VERSION")
                renderer_ok=true
                for token in 'cueMurmur' 'limiter.threshold.value=-22' 'ambiente_zoologico' 'equipo_medico' 'caja_registradora' 'ambiente_biblioteca' 'ambiente_escuela' 'ambiente_museo' 'ambiente_hotel' 'ambiente_iglesia' 'ambiente_parque' 'ambiente_piscina' 'ambiente_autobus' 'ambiente_construccion' 'ambiente_teatro' 'ambiente_gimnasio' 'paginas' 'campanas_iglesia' 'elevador'; do
                  if ! has "$token" "$renderer"; then echo "Missing film-renderer token: $token"; renderer_ok=false; fi
                done
                if [ "$renderer_ok" = true ]; then
                  maker=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/video-maker.js?v=$ASSET_VERSION")
                  maker_ok=true
                  for token in 'voiceCompressor' 'normalizedGain=Math.min(8' 'rms<0.0005' 'source.playbackRate.value=1' 'source.start(context.currentTime+1.1)' 'No se detectaron líneas de diálogo'; do
                    if ! has "$token" "$maker"; then echo "Missing video-maker token: $token"; maker_ok=false; fi
                  done
                  if [ "$maker_ok" = true ]; then
                    api=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/api/jobs")
                    if has 'free-allocation-only-no-provider-fallback' "$api"; then
                      echo "PRODUCTION AUDIO ASSETS VERIFIED"
                      echo "Deployed contextual sound engine, improved speech normalization, silent-audio guard, and free-only API policy are present."
                      exit 0
                    fi
                    echo "Attempt $attempt/24: free-only API policy response is not ready"
                  else
                    echo "Attempt $attempt/24: speech renderer checks failed"
                  fi
                else
                  echo "Attempt $attempt/24: film renderer checks failed"
                fi
              else
                echo "Attempt $attempt/24: scene engine checks failed"
              fi
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "Production audio asset verification did not pass."
          exit 1
