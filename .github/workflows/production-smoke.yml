name: Verify VIDEO STUDIO AI production audio
on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - "video-studio-ai/functions/**"
      - "video-studio-ai/worker/**"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Manual deploy to Cloudflare Pages"]
    types: [completed]
jobs:
  production-audio-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Pages and verify contextual audio deployment
        env:
          PRODUCTION_URL: https://video-studio-ai.pages.dev
          ASSET_VERSION: "20261127-audio4"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if html=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/?v=$ASSET_VERSION"); then
              if ! grep -q "/scene-engine.js?v=$ASSET_VERSION" <<< "$html"; then
                echo "Attempt $attempt/24: waiting for the latest production asset version"
              elif scene=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/scene-engine.js?v=$ASSET_VERSION"); then
                if grep -q 'audioVersion:"20261127-audio4"' <<< "$scene" \\
                  && grep -q 'function addMurmur' <<< "$scene" \\
                  && grep -q 'function addBirdChirps' <<< "$scene" \\
                  && grep -q 'function addEngineRev' <<< "$scene" \\
                  && grep -q 'addBirdChirps' <<< "$scene" \
                  && grep -q 'ambiente_zoologico' <<< "$scene" \
                  && grep -q 'ambiente_consultorio' <<< "$scene" \
                  && grep -q 'ambiente_mercado' <<< "$scene" \
                  && grep -q 'ambiente_plaza_comercial' <<< "$scene" \
                  && grep -q 'ambiente_restaurante' <<< "$scene" \
                  && grep -q 'ambiente_autodromo' <<< "$scene" \
                  && grep -q 'ambiente_calle' <<< "$scene" \
                  && grep -q 'ambiente_biblioteca' <<< "$scene" \
                  && grep -q 'ambiente_escuela' <<< "$scene" \
                  && grep -q 'ambiente_museo' <<< "$scene" \
                  && grep -q 'ambiente_hotel' <<< "$scene" \
                  && grep -q 'ambiente_iglesia' <<< "$scene" \
                  && grep -q 'ambiente_parque' <<< "$scene" \
                  && grep -q 'ambiente_piscina' <<< "$scene" \
                  && grep -q 'ambiente_autobus' <<< "$scene" \
                  && grep -q 'ambiente_construccion' <<< "$scene" \
                  && grep -q 'ambiente_teatro' <<< "$scene" \
                  && grep -q 'ambiente_gimnasio' <<< "$scene"; then
                  renderer=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/film-renderer.js?v=$ASSET_VERSION")
                  if grep -q 'cueMurmur' <<< "$renderer" \
                    && grep -q 'limiter.threshold.value=-22' <<< "$renderer" \\
                    && grep -q 'ambiente_zoologico' <<< "$renderer" \
                    && grep -q 'equipo_medico' <<< "$renderer" \
                    && grep -q 'caja_registradora' <<< "$renderer" \
                    && grep -q 'ambiente_biblioteca' <<< "$renderer" \
                    && grep -q 'ambiente_escuela' <<< "$renderer" \
                    && grep -q 'ambiente_museo' <<< "$renderer" \
                    && grep -q 'ambiente_hotel' <<< "$renderer" \
                    && grep -q 'ambiente_iglesia' <<< "$renderer" \
                    && grep -q 'ambiente_parque' <<< "$renderer" \
                    && grep -q 'ambiente_piscina' <<< "$renderer" \
                    && grep -q 'ambiente_autobus' <<< "$renderer" \
                    && grep -q 'ambiente_construccion' <<< "$renderer" \
                    && grep -q 'ambiente_teatro' <<< "$renderer" \
                    && grep -q 'ambiente_gimnasio' <<< "$renderer" \
                    && grep -q 'paginas' <<< "$renderer" \
                    && grep -q 'campanas_iglesia' <<< "$renderer" \
                    && grep -q 'elevador' <<< "$renderer"; then
                    maker=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/video-maker.js?v=$ASSET_VERSION")
                    if grep -q 'voiceCompressor' <<< "$maker" \
                      && grep -q 'voiceGain.gain.value' <<< "$maker" \
                      && grep -q 'source.playbackRate.value=1' <<< "$maker" \
                      && grep -q 'source.start(context.currentTime+1.1)' <<< "$maker"; then
                      api=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/api/jobs")
                      if grep -q 'free-allocation-only-no-provider-fallback' <<< "$api"; then
                        echo "PRODUCTION AUDIO VERIFIED"
                        echo "Cloudflare serves the contextual soundscapes, normalized Spanish dialogue, and free-only API policy."
                        exit 0
                      fi
                      echo "Attempt $attempt/24: API policy response is not ready"
                    else
                      echo "Attempt $attempt/24: normalized Spanish dialogue renderer is missing"
                    fi
                  else
                    echo "Attempt $attempt/24: browser sound renderer is missing required context cues"
                  fi
                else
                  echo "Attempt $attempt/24: scene analyzer is missing required location cues"
                fi
              else
                echo "Attempt $attempt/24: scene engine is not reachable yet"
              fi
            else
              echo "Attempt $attempt/24: production HTML is not reachable yet"
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "Production contextual audio verification did not pass."
          exit 1
