name: Verify VIDEO STUDIO AI production audio
on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - "video-studio-ai/functions/**"
      - "video-studio-ai/worker/**"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
jobs:
  production-audio-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Wait for Cloudflare Pages and verify contextual audio deployment
        env:
          PRODUCTION_URL: https://video-studio-ai.pages.dev
          ASSET_VERSION: "20261126-audio1"
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if html=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/?v=$ASSET_VERSION"); then
              if ! grep -q "/scene-engine.js?v=$ASSET_VERSION" <<< "$html"; then
                echo "Attempt $attempt/24: waiting for the latest production asset version"
              elif scene=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/scene-engine.js?v=$ASSET_VERSION"); then
                if grep -q 'ambiente_zoologico' <<< "$scene" \
                  && grep -q 'ambiente_consultorio' <<< "$scene" \
                  && grep -q 'ambiente_mercado' <<< "$scene" \
                  && grep -q 'ambiente_plaza_comercial' <<< "$scene" \
                  && grep -q 'ambiente_restaurante' <<< "$scene" \
                  && grep -q 'ambiente_autodromo' <<< "$scene" \
                  && grep -q 'ambiente_calle' <<< "$scene"; then
                  renderer=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/film-renderer.js?v=$ASSET_VERSION")
                  if grep -q 'ambiente_zoologico' <<< "$renderer" \
                    && grep -q 'equipo_medico' <<< "$renderer" \
                    && grep -q 'caja_registradora' <<< "$renderer"; then
                    api=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/api/jobs")
                    if grep -q 'free-allocation-only-no-provider-fallback' <<< "$api"; then
                      echo "PRODUCTION AUDIO VERIFIED"
                      echo "Cloudflare serves the contextual scene analyzer, browser sound renderer, and free-only API policy."
                      exit 0
                    fi
                    echo "Attempt $attempt/24: API policy response is not ready"
                  else
                    echo "Attempt $attempt/24: browser sound renderer is missing required context cues"
                  fi
                else
                  echo "Attempt $attempt/24: scene analyzer is missing required location cues"
                fi
              else
                echo "Attempt $attempt/24: scene engine is not reachable yet"
              fi
            else
              echo "Attempt $attempt/24: production HTML is not reachable yet"
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "Production contextual audio verification did not pass."
          exit 1
