name: Verify VIDEO STUDIO AI production
on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
jobs:
  production-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Wait for Cloudflare Pages production deployment and verify project lifecycle
        env:
          PRODUCTION_URL: https://video-studio-ai.pages.dev
        run: |
          set -euo pipefail
          for attempt in $(seq 1 24); do
            if html=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/?v=20261125-5"); then
              if ! grep -q '/app.js?v=20261125-5' <<< "$html"; then
                echo "Attempt $attempt/24: production HTML is not on the current project lifecycle build"
              elif app=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/app.js?v=20261125-5"); then
                if grep -q 'Eliminar proyecto' <<< "$app" && grep -q 'Proyecto creado, guardado y verificado en tu biblioteca' <<< "$app"; then
                  echo "PRODUCTION VERIFIED"
                  echo "Cloudflare Pages serves the project create/save/verify/delete code."
                  exit 0
                fi
                echo "Attempt $attempt/24: deployed app.js is missing project lifecycle code"
              else
                echo "Attempt $attempt/24: app.js is not reachable yet"
              fi
            else
              echo "Attempt $attempt/24: production page is not reachable yet"
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "Production verification did not pass after 7 minutes."
          exit 1
