name: Verify VIDEO STUDIO AI natural audio in production
on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - "video-studio-ai/functions/**"
      - "video-studio-ai/worker/**"
      - ".github/workflows/production-smoke.yml"
  workflow_dispatch:
  workflow_run:
    workflows: ["Manual deploy to Cloudflare Pages"]
    types: [completed]
jobs:
  natural-audio-smoke:
    if: ${{ github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Verify natural audio assets deployed and wired to all renderers
        env:
          PRODUCTION_URL: https://video-studio-ai.pages.dev
          ASSET_VERSION: "20261127-natural2"
        run: |
          set -euo pipefail
          has() { grep -Fq -- "$1" <<< "$2"; }
          for attempt in $(seq 1 24); do
            if ! html=$(curl --fail --silent --show-error --location --connect-timeout 4 --max-time 8 "$PRODUCTION_URL/?v=$ASSET_VERSION"); then
              echo "Attempt $attempt/24: production HTML is not reachable"
            elif ! has "/natural-audio.js?v=$ASSET_VERSION" "$html"; then
              echo "Attempt $attempt/24: waiting for natural audio asset version $ASSET_VERSION"
            else
              library=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/natural-audio.js?v=$ASSET_VERSION")
              scene=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/scene-engine.js?v=$ASSET_VERSION")
              renderer=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/film-renderer.js?v=$ASSET_VERSION")
              maker=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/video-maker.js?v=$ASSET_VERSION")
              ok=true
              for token in '/audio/rain.ogg' '/audio/forest.ogg' '/audio/birds.ogg' '/audio/footsteps.ogg' '/audio/cafe.ogg' '/audio/city.ogg' '/audio/engine.ogg' '/audio/workshop.ogg' '/audio/door.ogg' '/audio/water.ogg' 'decodeAudioData' 'same-origin'; do
                if ! has "$token" "$library"; then echo "Missing natural library token: $token"; ok=false; fi
              done
              for token in 'await window.VSANaturalAudio.load' 'natural.play(master,cue,when,len,ambienceLevel)' 'audioVersion:"20261127-natural2"'; do
                if ! has "$token" "$scene"; then echo "Missing short-video natural audio token: $token"; ok=false; fi
              done
              for token in 'window.VSANaturalAudio.load' 'natural.play(master,cue,segmentStart,duration,level)' 'action:"generate_speech_batch"' 'peak<.002'; do
                if ! has "$token" "$renderer"; then echo "Missing film natural audio token: $token"; ok=false; fi
              done
              if ! has 'stopAudio=await window.VSASceneEngine.buildAudio' "$maker"; then
                echo "Short-video renderer does not await natural audio loading"; ok=false
              fi
              for file in rain forest birds footsteps cafe city engine workshop door water; do
                bytes=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/audio/$file.ogg" | wc -c)
                if [ "$bytes" -lt 2048 ]; then echo "Missing or incomplete deployed audio: $file.ogg"; ok=false; fi
              done
              forest_bytes=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/audio/forest.ogg" | wc -c)
              if [ "$forest_bytes" -lt 900000 ] || [ "$forest_bytes" -gt 1300000 ]; then
                echo "Deployed forest ambience is not the verified clean woodland recording"; ok=false
              fi
              if [ "$ok" = true ]; then
                api=$(curl --fail --silent --show-error --location "$PRODUCTION_URL/api/jobs")
                if has 'free-allocation-only-no-provider-fallback' "$api" && has 'speechBatchMaxCharacters' "$api"; then
                  echo "PRODUCTION NATURAL AUDIO LIBRARY VERIFIED"
                  echo "Recorded rain, forest, birds, footsteps, cafe, city, engine, workshop, door and water are deployed and connected to the short and long video renderers."
                  exit 0
                fi
              fi
            fi
            if [ "$attempt" -lt 24 ]; then sleep 10; fi
          done
          echo "Production natural audio verification did not pass."
          exit 1
