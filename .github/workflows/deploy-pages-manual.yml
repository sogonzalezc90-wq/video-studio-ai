name: Manual deploy to Cloudflare Pages

on:
  push:
    branches: ["main"]
    paths:
      - "video-studio-ai/public/**"
      - "video-studio-ai/functions/**"
      - "video-studio-ai/worker/**"
      - "video-studio-ai/package.json"
      - ".github/workflows/deploy-pages-manual.yml"
  workflow_dispatch:
    inputs:
      confirm_production:
        description: "Confirmar publicación en producción"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: video-studio-ai-cloudflare-production
  cancel-in-progress: false

jobs:
  deploy:
    if: ${{ github.event_name == 'push' || inputs.confirm_production == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Verify required secrets
        working-directory: video-studio-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          test -n "$CLOUDFLARE_API_TOKEN" || { echo "Missing GitHub secret: CLOUDFLARE_API_TOKEN"; exit 1; }
          test -n "$CLOUDFLARE_ACCOUNT_ID" || { echo "Missing GitHub secret: CLOUDFLARE_ACCOUNT_ID"; exit 1; }

      - name: Download royalty-free natural ambience recordings
        working-directory: video-studio-ai
        run: |
          set -euo pipefail
          mkdir -p public/audio
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/3/3d/Rain.ogg" -o public/audio/rain.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/7/75/Birdsong_mild_sunny_day.ogg" -o public/audio/forest.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/3/38/Birds_forest.ogg" -o public/audio/birds.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/1/10/Forest_track.ogg" -o public/audio/footsteps.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/5/54/Cafe_ambiance.ogg" -o public/audio/cafe.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/8/88/Sonido_del_centro_de_la_ciudad_a_las_8_de_la_ma%C3%B1ana.ogg" -o public/audio/city.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/9/98/Maserati_GranTurismo_S_Exhaust.ogg" -o public/audio/engine.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/d/d2/Mowing_and_sawing_etc.ogg" -o public/audio/workshop.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/7/74/Door_handle_creaking.ogg" -o public/audio/door.ogg
          curl --fail --location --retry 3 --silent --show-error "https://upload.wikimedia.org/wikipedia/commons/2/26/Flowing-water-100019.ogg" -o public/audio/water.ogg
          for file in public/audio/*.ogg; do test "$(stat -c%s "$file")" -gt 2048; done
          forest_bytes=$(stat -c%s public/audio/forest.ogg)
          test "$forest_bytes" -ge 900000 && test "$forest_bytes" -le 1300000
          echo "NATURAL SOUND LIBRARY READY"
          du -h public/audio/*.ogg
      - name: Deploy existing Pages project
        working-directory: video-studio-ai
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4 pages deploy public --project-name=video-studio-ai --branch=main
